# Database Connection - Optimized for Aiven MySQL
# Updated the URL to enforce SSL as required by Aiven
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Driver and Dialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=none
# Connection Pool Settings (Hikari)
# Kept your original sizing but cleaned up for compatibility
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Server Configuration
# Using port 8081 as seen in your logs
server.port=8081
spring.flyway.enabled=false

# Application Security & JWT
app.jwt.secret=anvaySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLongForSecurity
app.jwt.expiration-ms=86400000

# Super Admin Credentials
app.superadmin.name=Super Admin
app.superadmin.email=admin@anvay.com
app.superadmin.password=Admin@123